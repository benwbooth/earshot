# Publishes https://benwbooth.github.io/earshot/: the project page in docs/,
# plus the Flatpak repository from the latest release under /flatpak/.
name: Pages

# Started by the Release workflow once a release's files are up (or by hand).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages isn't available for private repositories on a free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      APP_ID: io.github.benwbooth.Earshot
      SITE: https://benwbooth.github.io/earshot
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          mkdir site
          cp -r docs/. site/
          touch site/.nojekyll
          # The latest release's Flatpak repository, signed, at /flatpak/, with
          # earshot.flatpakref (flatpak install --user …/earshot.flatpakref) and
          # earshot.flatpakrepo (flatpak remote-add) beside the page.
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern earshot-flatpak-repo.tar.gz --dir "$RUNNER_TEMP"; then
            echo "No release has a Flatpak repository yet."
            exit 0
          fi
          mkdir -p site/flatpak
          tar -xzf "$RUNNER_TEMP/earshot-flatpak-repo.tar.gz" -C site/flatpak --strip-components=1
          key=""
          # Signed when the key is set up (the secret, and its public half in the repository).
          if [ -n "$GPG_KEY" ] && [ -f packaging/flatpak/earshot-flatpak.gpg ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq flatpak >/dev/null
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -m 700 "$GNUPGHOME"
            printf '%s' "$GPG_KEY" | gpg --batch --import
            fingerprint=$(gpg --batch --show-keys --with-colons packaging/flatpak/earshot-flatpak.gpg | awk -F: '$1 == "fpr" { print $10; exit }')
            flatpak build-sign --gpg-homedir="$GNUPGHOME" --gpg-sign="$fingerprint" site/flatpak "$APP_ID" master
            flatpak build-update-repo --gpg-homedir="$GNUPGHOME" --gpg-sign="$fingerprint" site/flatpak
            key="GPGKey=$(base64 -w0 packaging/flatpak/earshot-flatpak.gpg)"
          fi
          printf '%s\n' "[Flatpak Repo]" "Title=Earshot" "Url=$SITE/flatpak/" \
            "Homepage=$SITE/" "Comment=Earshot music player" "Icon=$SITE/earshot.svg" $key \
            > site/earshot.flatpakrepo
          printf '%s\n' "[Flatpak Ref]" "Title=Earshot" "Name=$APP_ID" "Branch=master" \
            "Url=$SITE/flatpak/" "SuggestRemoteName=earshot" "IsRuntime=false" \
            "RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo" "Homepage=$SITE/" \
            "Icon=$SITE/earshot.svg" $key \
            > site/earshot.flatpakref
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
