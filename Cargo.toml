[workspace]
resolver = "3"
members = [".", "crates/core", "crates/server", "crates/web"]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[package]
name = "earshot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A modern desktop music player: charts by genre and era, Reddit radio, albums and playlists, played from YouTube"
repository = "https://github.com/benwbooth/earshot"

[dependencies]
cpal = "0.18"
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
earshot-core = { path = "crates/core" }
earshot-server = { path = "crates/server" }
serde_json = "1.0"

# Linux: record the speakers through PipeWire's own API.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire"] }

[build-dependencies]
cxx-qt-build = "0.10.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

# Size-optimized build for the WebAssembly interface only.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
