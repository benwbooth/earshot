[workspace]
resolver = "3"
members = [".", "crates/core", "crates/server", "crates/speakers", "crates/web"]
default-members = ["."]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"

[package]
name = "earshot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A desktop and web music player for all of YouTube's music, plus Bandcamp, SoundCloud, Mixcloud and the Internet Archive"
repository = "https://github.com/benwbooth/earshot"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
earshot-core = { path = "crates/core" }
earshot-server = { path = "crates/server" }
earshot-speakers = { path = "crates/speakers" }
serde_json = "1.0"

[build-dependencies]
cxx-qt-build = "0.10.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

# Size-optimized build for the WebAssembly interface only.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# One build for everything: devloop (the app you run), cargo run, cargo test
# and the editor all use this profile, so they share target/debug. It's
# release-grade (optimized, no debug info) and stays incremental, so a small
# change rebuilds in seconds. `cargo build --release` is only for packaging.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = true
