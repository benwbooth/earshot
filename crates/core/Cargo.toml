[package]
name = "earshot-core"
description = "Earshot's music services (YouTube, Bandcamp, SoundCloud, Mixcloud, the Internet Archive, Deezer, Reddit) and library, shared by the Qt app and the web server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
directories = "6.0"
# SQLite built in, so every platform's Earshot has the same database engine.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Decodes songs (YouTube's AAC, SoundCloud's and Bandcamp's MP3s) to measure the web version's waveform.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4"] }
ureq = { version = "3.1", features = ["json"] }

[target.'cfg(unix)'.dependencies]
# The local time zone's offset, so For You's days start at local midnight.
libc = "0.2"
