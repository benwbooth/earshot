[package]
name = "earshot-web"
description = "Earshot's web version (desktop and mobile layouts), in Leptos, built to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Must match the wasm-bindgen CLI in nixpkgs.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlIFrameElement", "HtmlAudioElement", "HtmlMediaElement",
  "HtmlInputElement", "MessageEvent", "EventSource", "Storage", "Location", "History", "Notification",
  "NotificationOptions", "NotificationPermission", "KeyboardEvent", "MouseEvent", "PointerEvent", "DomRect",
  "MediaSession", "MediaMetadata", "MediaSessionAction", "Navigator", "MediaSessionPlaybackState", "MediaImage",
  "ScrollToOptions", "ScrollBehavior", "Event", "EventTarget", "AddEventListenerOptions", "VisibilityState",
  "AudioContext", "BaseAudioContext", "AudioContextState", "AnalyserNode", "AudioNode", "AudioDestinationNode",
  "MediaElementAudioSourceNode",
] }
