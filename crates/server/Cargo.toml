[package]
name = "earshot-server"
description = "Serves Earshot's web version and answers its requests with the shared core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "earshot-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
earshot-core = { path = "../core" }
futures-util = { version = "0.3", default-features = false }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
